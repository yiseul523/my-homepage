
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오크의 기록</title>
  <style>
    body {
      max-width: 720px;
      margin: 60px auto;
      padding: 20px;
      font-family: sans-serif;
      line-height: 1.8;
      color: #333;
    }
    h1 { font-size: 32px; }
    a { color: #2563eb; }
    article {
      border-bottom: 1px solid #ddd;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <h1>오크의 기록</h1>
  <p>나의 생각과 일상을 기록하는 공간입니다.</p>

  <h2>최근 기록</h2>
  <article>
    <h3>첫 번째 기록</h3>
    <p>오늘 나만의 블로그를 만들기 시작했다.</p>
  </article>

  <article>
    <h3>블로그를 만드는 이유</h3>
    <p>내가 경험하고 배운 것들을 차곡차곡 남기고 싶다.</p>
  </article>
</body>
</html>
